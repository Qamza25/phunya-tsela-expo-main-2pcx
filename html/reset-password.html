<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Phunya Tsela</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
:root {
  --primary: #d97706;
  --yellow:  #f59e0b;
  --bg:      #fafaf9;
  --border:  #e5e7eb;
  --text:    #111827;
  --muted:   #6b7280;
  --error:   #ef4444;
  --radius:  12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
h1, h2 { font-family: 'Sora', sans-serif; }
.card {
  background: white;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 40px rgba(0,0,0,.07);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
}
.card-header {
  background: linear-gradient(135deg, var(--primary), var(--yellow));
  padding: 28px 32px;
  text-align: center;
  color: white;
}
.card-header .logo { font-size: 36px; margin-bottom: 8px; }
.card-header h1 { font-size: 22px; font-weight: 900; }
.card-body { padding: 32px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.form-group input {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #fde68a44;
}
.hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.submit-btn {
  width: 100%;
  height: 50px;
  border: none;
  border-radius: 14px;
  background: var(--primary);
  color: white;
  font-family: 'Sora', sans-serif;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-top: 8px;
  transition: filter .2s;
}
.submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
.submit-btn:disabled { opacity: .6; cursor: not-allowed; }
.banner {
  border-radius: var(--radius);
  padding: 12px 14px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.banner.error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
.banner.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
.banner.show    { display: block; }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin: auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
#waitingState { text-align: center; color: var(--muted); font-size: 14px; padding: 8px 0 16px; }
.back-link {
  display: block;
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
}
.back-link:hover { color: var(--primary); }
.home-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  width: 100%;
  height: 46px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: white;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
  text-decoration: none;
  transition: border-color .2s, background .2s;
}
.home-btn:hover { border-color: var(--primary); background: #fffbeb; color: var(--primary); }
.home-btn svg { flex-shrink: 0; }
.card-footer {
  border-top: 1px solid var(--border);
  padding: 18px 32px;
  text-align: center;
}
.card-footer a {
  font-size: 13px;
  color: var(--muted);
  text-decoration: none;
}
.card-footer a:hover { color: var(--primary); }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">🔒</div>
    <h1>Create New Password</h1>
  </div>

  <div class="card-body">
    <div class="banner error"   id="errBanner"></div>
    <div class="banner success" id="okBanner"></div>

    <div id="waitingState">Verifying your reset link…</div>

    <div id="formState" style="display:none;">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="password" placeholder="Create a new password" autocomplete="new-password">
        <p class="hint">Minimum 6 characters</p>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" autocomplete="new-password">
      </div>
      <button class="submit-btn" id="submitBtn" onclick="doReset()">Update Password</button>
      <a class="back-link" href="forgot-password.html">← Request a new link</a>

      <a class="home-btn" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Home
      </a>
    </div>
  </div>

  <div class="card-footer">
    <a href="login.html">Remember your password? Sign in</a>
  </div>
</div>

<script>
// ── Supabase client (same project as auth.js) ──────────────────────────────
var SUPABASE_URL = 'https://lfnnglzjqszdjomjmpkw.supabase.co';
var SUPABASE_KEY = 'sb_publishable_zfTqPTfONlZ04Of9ERrKww_2ICi7FCU';

var _resetSb = null;
function getSb() {
  if (_resetSb) return _resetSb;
  var lib = (typeof supabase !== 'undefined' && supabase)
         || (typeof window   !== 'undefined' && window.supabase);
  if (!lib || typeof lib.createClient !== 'function') {
    throw new Error('Supabase CDN not loaded.');
  }
  _resetSb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
  return _resetSb;
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function showErr(msg) {
  var b = document.getElementById('errBanner');
  b.textContent = msg;
  b.classList.add('show');
  document.getElementById('okBanner').classList.remove('show');
}
function showOk(msg) {
  var b = document.getElementById('okBanner');
  b.textContent = msg;
  b.classList.add('show');
  document.getElementById('errBanner').classList.remove('show');
}
function setLoading(yes) {
  var btn = document.getElementById('submitBtn');
  btn.disabled = yes;
  btn.innerHTML = yes ? '<div class="spinner"></div>' : 'Update Password';
}

// ── On load: pick up recovery token from URL hash ──────────────────────────
//
// Supabase emails a link like:
//   https://your-domain.co.za/reset-password.html
//   #access_token=XXX&refresh_token=YYY&type=recovery
//
// We read those values from the hash and call setSession() so the Supabase
// client is authenticated and can accept the password update.
// ──────────────────────────────────────────────────────────────────────────
window.addEventListener('load', async function () {
  try {
    var sb   = getSb();
    var hash = window.location.hash;

    if (hash && hash.includes('access_token')) {
      // Parse the fragment (strip the leading #)
      var params       = new URLSearchParams(hash.substring(1));
      var accessToken  = params.get('access_token');
      var refreshToken = params.get('refresh_token') || '';
      var type         = params.get('type');

      if (accessToken && type === 'recovery') {
        // Establish the session using the tokens from the link
        var { error: sessionError } = await sb.auth.setSession({
          access_token:  accessToken,
          refresh_token: refreshToken,
        });

        // Clean the hash from the URL bar (looks tidier, prevents reuse)
        history.replaceState(null, '', window.location.pathname);

        document.getElementById('waitingState').style.display = 'none';

        if (sessionError) {
          showErr('This reset link is invalid or has expired. Please request a new one.');
          return;
        }

        document.getElementById('formState').style.display = 'block';
        return;
      }
    }

    // No recovery token in the URL — check if there's already an active session
    // (e.g. user is already logged in and navigated here directly)
    var { data: { session } } = await sb.auth.getSession();
    document.getElementById('waitingState').style.display = 'none';

    if (session && session.user) {
      document.getElementById('formState').style.display = 'block';
    } else {
      showErr('No valid reset link found. Please go to Forgot Password and request a new link.');
    }

  } catch (e) {
    document.getElementById('waitingState').style.display = 'none';
    showErr('Something went wrong verifying your link. Please try again.');
    console.error('reset-password load error:', e);
  }
});

// ── Submit new password ────────────────────────────────────────────────────
async function doReset() {
  var password        = document.getElementById('password').value;
  var confirmPassword = document.getElementById('confirmPassword').value;

  document.getElementById('errBanner').classList.remove('show');

  if (!password || password.length < 6) {
    showErr('Password must be at least 6 characters.');
    return;
  }
  if (password !== confirmPassword) {
    showErr('Passwords do not match.');
    return;
  }

  setLoading(true);

  // Auth.updatePassword uses the shared Supabase client from auth.js;
  // the session we set above via setSession() is shared across both clients
  // because they use the same project URL + key (same localStorage key).
  var result = await Auth.updatePassword(password);

  setLoading(false);

  if (result.ok) {
    document.getElementById('formState').style.display = 'none';
    showOk('Password updated successfully! Redirecting you to login…');
    setTimeout(function () { window.location.href = 'login.html'; }, 2000);
  } else {
    showErr(result.error || 'Could not update password. Please request a new reset link.');
  }
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doReset();
});
</script>

</body>
</html>
